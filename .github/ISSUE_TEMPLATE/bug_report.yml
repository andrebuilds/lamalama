name: Bug report
description: Something in LamaLama doesn't work as expected
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please search [existing issues](https://github.com/andrebuilds/lamalama/issues) first.
        **Security problems:** don't file them here — see [SECURITY.md](https://github.com/andrebuilds/lamalama/blob/main/SECURITY.md).
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open a clip in the editor
        2. Drag the playhead to…
        3. See…
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where did it happen?
      options:
        - lamalama.video (hosted)
        - Self-hosted / local development
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and OS
      placeholder: Chrome 140 on macOS 15
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: For self-hosted setups, the release tag or commit SHA.
  - type: textarea
    id: logs
    attributes:
      label: Logs, screenshots or recordings
      description: Browser console errors, worker logs, screenshots… Remove any secrets first.
